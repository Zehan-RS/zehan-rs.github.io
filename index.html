<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zehan — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=UnifrakturCook:wght@700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080a;
    --wall-2:#111013;
    --ink:#f2ede6;
    --muted:#948a80;
    --blood:#b3121b;
    --blood-bright:#ff4141;
    --card:#141112;
    --card-edge:#1d1516;
    --line:#2b2223;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    min-height:100dvh;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, #1a1416 0%, var(--bg) 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 14px;
    position:relative;
    overflow-x:hidden;
  }

  /* film-grain overlay, drawn onto canvas by JS, sits above everything */
  #grain{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.05;
    mix-blend-mode:overlay;
    z-index:50;
  }

  .wrap{
    width:100%;
    max-width:400px;
    position:relative;
  }

  .card{
    position:relative;
    background:
      linear-gradient(180deg, var(--card) 0%, #0f0c0d 100%);
    border:1px solid var(--card-edge);
    padding:40px 26px 52px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,.7),
      0 0 0 1px rgba(255,255,255,.02) inset;
    transform:rotate(-0.6deg);
    clip-path:polygon(
      0% 0%, 100% 0%, 100% 97%,
      93% 100%, 86% 96%, 79% 100%, 72% 97%, 65% 100%,
      58% 96%, 51% 100%, 44% 97%, 37% 100%, 30% 96%,
      23% 100%, 16% 97%, 9% 100%, 2% 96%, 0% 100%
    );
  }

  /* pieces of tape holding the flyer up */
  .tape{
    position:absolute;
    width:74px;
    height:24px;
    top:-11px;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.14) 0 2px, transparent 2px 6px),
      rgba(230,222,212,.14);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 4px 10px rgba(0,0,0,.35);
    z-index:5;
  }
  .tape.left{ left:14px; transform:rotate(-8deg); }
  .tape.right{ right:14px; transform:rotate(6deg); }

  /* ---------- header ---------- */
  .avatar-holder{
    position:relative;
    width:112px;
    height:112px;
    margin:4px auto 22px;
  }
  .avatar-glow{
    position:absolute;
    inset:-14px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(179,18,27,.55) 0%, rgba(179,18,27,0) 70%);
    animation:pulse 3.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:.55; transform:scale(1); }
    50%{ opacity:.95; transform:scale(1.08); }
  }
  .avatar{
    position:relative;
    width:112px;
    height:112px;
    border-radius:50%;
    border:2px solid var(--blood);
    background:#1b1518;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Anton',sans-serif;
    font-size:34px;
    letter-spacing:1px;
    color:var(--ink);
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

  h1.name{
    font-family:'Anton',sans-serif;
    font-weight:400;
    font-size:44px;
    line-height:1;
    letter-spacing:1px;
    text-align:center;
    margin:0 0 10px;
    text-transform:uppercase;
    text-shadow:0 0 22px rgba(179,18,27,.35);
  }

  .handle{
    font-family:'UnifrakturCook', cursive;
    font-size:19px;
    text-align:center;
    color:var(--blood-bright);
    opacity:.85;
    margin:0 0 18px;
    letter-spacing:.5px;
  }

  p.bio{
    text-align:center;
    color:var(--muted);
    font-size:14.5px;
    line-height:1.6;
    max-width:280px;
    margin:0 auto 28px;
  }

  /* jagged divider */
  .divider{ display:block; width:100%; height:12px; margin:0 0 26px; }
  .divider path{ stroke:var(--blood); stroke-width:1.4; fill:none; opacity:.55; }

  /* ---------- links ---------- */
  nav.links{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:30px;
  }
  nav.links a{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 18px;
    background:#181314;
    border:1px solid var(--line);
    color:var(--ink);
    text-decoration:none;
    font-family:'Jost',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:.6px;
    text-transform:uppercase;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease, background .15s ease;
    clip-path:polygon(0 0,100% 0,100% 100%,3% 100%);
  }
  nav.links a::before{
    content:"";
    width:3px;
    align-self:stretch;
    background:var(--blood);
    flex-shrink:0;
    transition:background .15s ease;
  }
  nav.links a .ic{ width:20px; height:20px; flex-shrink:0; color:var(--muted); transition:color .15s ease; }
  nav.links a .lbl{ flex:1; }
  nav.links a .arrow{ width:14px; height:14px; color:var(--muted); flex-shrink:0; }

  nav.links a:hover,
  nav.links a:focus-visible{
    background:#1f1516;
    border-color:var(--blood);
    box-shadow:0 0 0 1px rgba(179,18,27,.4), 0 8px 22px -8px rgba(179,18,27,.5);
    transform:translateX(3px);
  }
  nav.links a:hover .ic,
  nav.links a:focus-visible .ic{ color:var(--blood-bright); }
  nav.links a:focus-visible{ outline:2px solid var(--blood-bright); outline-offset:3px; }

  /* ---------- socials ---------- */
  .socials{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:28px;
  }
  .socials a{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#181314;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    transition:all .15s ease;
  }
  .socials a svg{ width:18px; height:18px; }
  .socials a:hover,
  .socials a:focus-visible{
    color:var(--ink);
    border-color:var(--blood);
    box-shadow:0 0 14px -2px rgba(179,18,27,.6);
    transform:translateY(-2px);
  }
  .socials a:focus-visible{ outline:2px solid var(--blood-bright); outline-offset:2px; }

  footer{
    text-align:center;
    color:#5a5153;
    font-size:11px;
    letter-spacing:.5px;
    text-transform:uppercase;
  }

  @media (prefers-reduced-motion: reduce){
    .avatar-glow{ animation:none; }
  }
</style>
</head>
<body>

<canvas id="grain"></canvas>

<div class="wrap">

      <div class="avatar">ZH</div>

    <h1 class="name">Zehan</h1>
    <p class="handle">† @zjhn †</p>
    <p class="bio">Hello! I'm Zehan, I'm 20 y.o</p>

    <svg class="divider" viewBox="0 0 300 12" preserveAspectRatio="none">
      <path d="M0,6 L15,2 L30,9 L45,3 L60,8 L75,2 L90,9 L105,3 L120,8 L135,2 L150,9 L165,3 L180,8 L195,2 L210,9 L225,3 L240,8 L255,2 L270,9 L285,3 L300,6" />
    </svg>

    <nav class="links">
      <a href="https://www.instagram.com/zjhn_rs" target="_blank" rel="noopener">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.2"/><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
        <span class="lbl">Instagram</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>

      <a href="https://www.tiktok.com/@usecrystalmeth69" target="_blank" rel="noopener">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 4v9.2a3.6 3.6 0 1 1-3-3.55"/><path d="M15 4c.5 2.3 2 3.7 4.3 4"/></svg>
        <span class="lbl">TikTok</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>

      <a href="https://open.spotify.com/user?si=PjRSu2V4QKecUNXL5goQmg" target="_blank" rel="noopener">

      <a href="https://t.me/usecrystalmeth69" target="_blank" rel="noopener">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 4L3 11.5l6 2.2M21 4l-4 16-6.7-6.3M21 4l-11.4 9.7"/></svg>
        <span class="lbl">Telegram</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>

    <footer>© 2026 Zehan — semua tautan</footer>
  </div>
</div>

<script>
  // grain/noise ringan di atas seluruh halaman, biar kesan poster lama
  (function(){
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var canvas = document.getElementById('grain');
    var ctx = canvas.getContext('2d');
    var w, h;

    function resize(){
      w = canvas.width = Math.floor(window.innerWidth / 2);
      h = canvas.height = Math.floor(window.innerHeight / 2);
      canvas.style.width = '100%';
      canvas.style.height = '100%';
    }
    function draw(){
      var imgData = ctx.createImageData(w, h);
      var buf = imgData.data;
      for(var i=0; i<buf.length; i+=4){
        var v = Math.random()*255;
        buf[i]=v; buf[i+1]=v; buf[i+2]=v; buf[i+3]=255;
      }
      ctx.putImageData(imgData, 0, 0);
    }
    resize();
    draw();
    window.addEventListener('resize', function(){ resize(); draw(); });
    if(!reduce){
      setInterval(draw, 140);
    }
  })();
</script>

</body>
</html>
